name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Indtec.ExcelMapper.sln

      - name: Build
        run: dotnet build Indtec.ExcelMapper.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/Indtec.ExcelMapper.Tests/Indtec.ExcelMapper.Tests.csproj -c Release --no-build

      - name: Pack
        run: dotnet pack src/Indtec.ExcelMapper/Indtec.ExcelMapper.csproj -c Release --no-build -o artifacts -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: fogacafe

      - name: Publish NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
